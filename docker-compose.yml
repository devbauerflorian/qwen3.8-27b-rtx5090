# docker-compose.yml
#
# Model selection comes from .env (see .env.example); unset keys keep the
# defaults, which serve the stock Qwen3.8-27B NVFP4 model:
#   MODEL_SUBDIR        weights dir under ./models/ (setup.sh downloads into it)
#   SERVED_MODEL_NAME   value for --served-model-name
#   VLLM_API_KEY        bearer key, empty = no auth
#
services:
  vllm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME:-vllm}
    restart: "always"
    ports:
      - "8020:8000"
    volumes:
      # Model weights, downloaded by setup.sh, mounted read-only
      - ./models/${MODEL_SUBDIR:-qwen3.8-27b-nvfp4}:/models/${MODEL_SUBDIR:-qwen3.8-27b-nvfp4}:ro
    environment:
      # CUDA and optimizer tuning
      - CUDA_VISIBLE_DEVICES=0
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
      - VLLM_FLOAT32_MATMUL_PRECISION=high
      - VLLM_NO_USAGE_STATS=1
      # Quite high RAM demand for building graphs - 64 GB can be not enough - adjust for our system 
      - MAX_JOBS=4
      - NVCC_THREADS=4
      # Secrets — loaded from .env (see .env.example), leave empty to disable auth
      - VLLM_API_KEY=${VLLM_API_KEY:-}
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # single RTX5090
              capabilities: [gpu]
    command:
      - --model
      - /models/${MODEL_SUBDIR:-qwen3.8-27b-nvfp4}
      - --served-model-name
      - ${SERVED_MODEL_NAME:-qwen3.8-27b}
      - --quantization
      - modelopt
      - --kv-cache-dtype
      - fp8
      - --tensor-parallel-size
      - "1"
      - --trust-remote-code
      - --max-model-len
      - "262144"
      - --max-num-seqs
      - "16"
      - --gpu-memory-utilization
      - "0.96"
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --host
      - 0.0.0.0
      - --port
      - "8000"
