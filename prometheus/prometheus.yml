# Prometheus configuration (mounted into the `prometheus` service).
#
# Both targets are scraped directly on the docker network — no auth needed
# there: vllm:8000 (engine + request metrics) and dcgm-exporter:9400
# (per-GPU: utilization, memory, power, temps). The public face (port 8020)
# is the caddy gateway, which routes /v1/*, /metrics and /dcgm/metrics
# behind HTTP Basic auth (METRICS_USER / METRICS_HASH from .env). Block
# 8020 at the firewall if you want no external exposure at all.
#
# The Prometheus UI is bound to 127.0.0.1:9090 only (see docker-compose.yml).
# Access it locally or via SSH tunnel.

global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets:
          - vllm:8000
        labels:
          model: qwen3.8-27b

  # Per-GPU metrics (DCGM: utilization, memory, power, temps).
  - job_name: dcgm
    metrics_path: /metrics
    static_configs:
      - targets:
          - dcgm-exporter:9400
